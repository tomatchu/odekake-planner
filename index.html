<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>週末おでかけ比較</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div>
    <h1>週末おでかけ比較</h1>
    <p class="lead">二人の出発・帰着、現地で過ごせる時間、費用を並べて決める</p>
  </div>
  <div class="top-actions">
    <button type="button" class="primary" id="btnNew">＋ 新しい案</button>
    <button type="button" id="btnReset">サンプルに戻す</button>
  </div>
</header>

<main>
  <section class="panel" aria-labelledby="hSettings">
    <h2 id="hSettings">二人の設定</h2>
    <div id="settings" class="settings"></div>
  </section>

  <section aria-labelledby="hCompare">
    <div class="section-head">
      <h2 id="hCompare">プランを比べる</h2>
      <p class="legend"><span class="tag warn">希望外</span> 希望の時刻から外れた項目　<span class="tag prov">暫定</span> 未入力の費用あり</p>
    </div>
    <div id="compareTable" class="table-wrap"></div>
    <div id="compareCards" class="cards"></div>
    <p id="empty" class="empty" hidden>案がまだありません。「＋ 新しい案」から作成してください。</p>
  </section>

  <section class="panel" aria-labelledby="hShare">
    <h2 id="hShare">決めた案を共有する</h2>
    <div class="share-controls">
      <label>共有する案
        <select id="sharePlan"></select>
      </label>
      <div class="seg" role="group" aria-label="文章の言語">
        <button type="button" data-lang="ja">日本語</button>
        <button type="button" data-lang="zh">简体中文</button>
      </div>
    </div>
    <textarea id="shareText" readonly rows="18" aria-label="共有文"></textarea>
    <div class="share-foot">
      <button type="button" class="primary" id="btnCopy">コピー</button>
      <span id="copyMsg" role="status" aria-live="polite"></span>
    </div>
  </section>

  <p class="note">時刻と運賃は手入力です。最初に入っている3つのサンプル案の時刻・料金は架空です。入力内容はこのブラウザに保存されます。</p>
</main>

<dialog id="editor" aria-labelledby="edTitle">
  <form id="editorForm" novalidate>
    <header>
      <h2 id="edTitle">案を編集</h2>
      <button type="button" class="icon" id="edClose" aria-label="閉じる">×</button>
    </header>
    <div class="ed-body">
      <fieldset>
        <legend>基本</legend>
        <div class="grid">
          <label class="wide">案の名前<input data-k="name" placeholder="例：電車のみ"></label>
          <label>日付<input type="date" data-k="date"></label>
          <label>行き先<input data-k="destination" placeholder="例：御岳山"></label>
          <label>集合駅<input data-k="meetStation"></label>
          <label>集合時刻<input type="time" data-k="meetTime"></label>
          <label>現地への到着<input type="time" data-k="arriveTime"></label>
          <label>現地を出発<input type="time" data-k="leaveTime"></label>
        </div>
      </fieldset>

      <div id="edPeople"></div>

      <fieldset>
        <legend>カーシェア</legend>
        <label class="check"><input type="checkbox" id="edCarUse"> カーシェアを使う</label>
        <div class="grid" id="edCar">
          <label class="wide">借りる場所<input data-c="place"></label>
          <label>予約開始<input type="time" data-c="start"></label>
          <label>予約終了<input type="time" data-c="end"></label>
          <label>利用料（円）<input type="number" min="0" step="1" inputmode="numeric" data-c="fee" placeholder="未入力"></label>
          <label>高速代（円）<input type="number" min="0" step="1" inputmode="numeric" data-c="toll" placeholder="未入力"></label>
          <label>駐車代（円）<input type="number" min="0" step="1" inputmode="numeric" data-c="parking" placeholder="未入力"></label>
        </div>
        <p class="hint">かからない費用は 0 を入力。空欄は「未入力」として合計が暫定になります。</p>
      </fieldset>

      <fieldset>
        <legend>その他の共通費</legend>
        <div id="edExtras" class="rows"></div>
        <button type="button" class="small" id="edAddExtra">＋ 共通費を追加</button>
      </fieldset>

      <fieldset>
        <legend>昼食・立ち寄りメモ</legend>
        <div id="edMemos" class="rows"></div>
        <button type="button" class="small" id="edAddMemo">＋ メモを追加</button>
      </fieldset>
    </div>
    <footer>
      <button type="button" id="edCancel">キャンセル</button>
      <button type="submit" class="primary">保存</button>
    </footer>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
